<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SEO_TITLE}}</title>
<meta name="description" content="{{SEO_DESCRIPTION}}">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#b01218">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="page page--error">
<main class="error-page">
  <div class="shell error-page__inner">
    <a class="logo logo--dark" href="/">{{LOGO_MARK}}</a>
    <p class="error-page__code">404</p>
    <h1 class="error-page__title">This car has already left the yard</h1>
    <p class="error-page__text">The listing you followed is sold or removed. Plenty of good stock is standing right now — take a look, or call the owners and we will find exactly what you need.</p>
    <div class="error-page__actions">
      <a class="btn btn--primary btn--lg" href="/cars">Browse available cars</a>
      <a class="btn btn--outline btn--lg" href="{{PHONE_1_TEL}}">Call {{PHONE_1}}</a>
      <a class="btn btn--whatsapp btn--lg" href="{{WHATSAPP_LINK}}" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <p class="muted small">{{SITE_NAME}} · {{ADDRESS}}</p>
  </div>
</main>
</body>
</html>
